name: Rust Safety Check

on: [push, pull_request]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  clippy-pedantic:
    name: Clippy (workspace, pedantic + nursery)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install system dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # `tauri::generate_context!()` (invoked indirectly by the Tauri build
      # script and by `tauri::generate_context!()` in `lib.rs`) embeds the
      # frontend dist at compile time.  The dist is built in the release
      # workflow but for clippy we only need a placeholder so the macro
      # has something to read.
      - name: Create dist placeholder (required by tauri::generate_context!)
        run: mkdir -p dist && touch dist/index.html

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Cache the workspace-root `target/` directory (set in
          # `.cargo/config.toml`) so the clippy run is incremental across
          # CI invocations.
          workspaces: ". -> target"
          save-if: false

      - name: Run clippy with warnings as errors
        # `--workspace` is essential: we have a Cargo workspace with two
        # members (`pdf-split-core` and the Tauri app), and we want every
        # crate linted.
        run: cargo clippy --workspace --all-targets -- -D warnings

  miri-test:
    name: Miri (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    strategy:
      # `pdf-split-core` is the only Tauri-free, FFI-free, `unsafe`-free
      # crate in the workspace, so it is the only one miri can validate.
      # Add more entries here as new pure crates land under `crates/`.
      fail-fast: false
      matrix:
        crate:
          - pdf-split-core
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: miri

      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pin the cache to the matrix member so miri's per-crate target
          # dir doesn't conflict with the clippy job's.
          workspaces: "crates/${{ matrix.crate }} -> target"
          save-if: false

      - name: Miri setup
        run: cargo +nightly miri setup

      - name: Miri test
        # Miri's coverage of `pdf-split-core` is intentionally narrow:
        # every test that exercises the production code path goes through
        # `lopdf`, which uses `rayon` and (transitively)
        # `crossbeam-epoch 0.9.18`.  That version has a known
        # Stacked-Borrows false positive in its lazy thread-local init
        # (see `crates/pdf-split-core/src/splitter.rs` and
        # `tests/public_api.rs` for the rationale), and the affected
        # tests are gated with `#[cfg(not(miri))]`.
        #
        # What Miri *does* validate is the rest of the crate: the
        # `PdfError` enum, its `Serialize` / `From` impls, and the
        # `unsafe`-forbidding lints.  If a future test depends only on
        # `unsafe`-free code and does not touch lopdf, it can drop the
        # `#[cfg(not(miri))]` and run here without any env tweaks.
        run: cargo +nightly miri test -p ${{ matrix.crate }}
