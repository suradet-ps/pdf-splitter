[package]
name = "pdf-splitter"
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
description = "A fast, beautiful macOS desktop app for splitting PDF files into individual pages."
authors = ["Suradet Pratomsak"]
license = "MIT"
repository = "https://github.com/suradet-ps/pdf-splitter"
readme = "../README.md"

# Required by Tauri – the crate must expose both a cdylib (for the app) and
# an rlib (so integration tests can link against it).
[lib]
name = "pdf_splitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Build dependencies

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Runtime dependencies

[dependencies]
# Tauri core – macOS target only needs the default feature set.
tauri = { version = "2.11.5", features = [] }

# Official Tauri plugins used by the app.
tauri-plugin-dialog  = "2.7.2"
tauri-plugin-opener  = "2.5.4"

# Pure-Rust PDF splitting engine.  This is the only place where
# business logic lives.  All PDF parsing/writing is delegated here.
# Version is pinned explicitly (no `{ workspace = true }`) so this
# crate remains self-contained.
pdf-split-core = { path = "../crates/pdf-split-core", version = "1.1.0" }

# Error handling — `PdfError` is re-exported from `pdf-split-core` but
# `thiserror` is also kept here in case the Tauri command layer wants to
# define glue-specific error types in the future.
thiserror = "2.0.20"

# Serialisation (Tauri commands pass data as JSON)
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Dev / test dependencies

[dev-dependencies]
tempfile = "3.27.0"

# Fixture-based parametrised testing.
rstest = "0.27.0"

# Profile tuning has moved to the workspace root `Cargo.toml`.

[lints]
workspace = true
